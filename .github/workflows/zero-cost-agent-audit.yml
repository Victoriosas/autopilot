name: Victoriosas zero-cost operational audit
on:
  workflow_dispatch:
  schedule:
    # 19:00 Uruguay (UTC-3), schedule may be delayed by GitHub
    - cron: '0 22 * * *'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: victoriosas-operational-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Read-only GitHub evidence, no model requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/zero-cost-agent-audit.mjs
