name: Autopilot Core v4

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches:
      - 'codex/**'
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Governance guardrails
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for obvious committed secrets..."
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9_-]{20,})' -- ':!.env.example' ':!package-lock.json' ':!bun.lock'; then
            echo "Potential hard-coded secret detected."
            exit 1
          fi
          echo "Guardrails passed."
