name: Autopilot Core v4

on:
  pull_request:
    branches: [main, 'codex/**']
  push:
    branches:
      - main
      - 'codex/**'
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Vercel build
        run: npm run build:vercel

      - name: Check initial public HTML and static assets
        run: node scripts/check-route-html.mjs

      - name: Secret value scan
        run: node scripts/secret-scan.mjs

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: autopilot_orchestrator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:db
        env:
          AUTOPILOT_TEST_DATABASE_URL: postgresql://postgres:isolated-test-password@127.0.0.1:5432/autopilot_orchestrator_test

      - name: Create disposable commerce database
        run: createdb -h 127.0.0.1 -p 5432 -U postgres victoriosa_checkout_test
        env:
          PGPASSWORD: isolated-test-password

      - name: Atomic commerce PostgreSQL regression tests
        run: node --import tsx --test tests/commerce-postgres.test.ts
        env:
          COMMERCE_TEST_DATABASE_URL: postgresql://postgres:isolated-test-password@127.0.0.1:5432/victoriosa_checkout_test

      - name: Create disposable hosted replay database
        run: createdb -h 127.0.0.1 -p 5432 -U postgres victoriosa_hosted_replay_test
        env:
          PGPASSWORD: isolated-test-password

      - name: Verify hosted and local migration version inventory
        run: node --import tsx --test tests/migration-history.test.ts

      - name: Canonical hosted migration replay
        run: node --import tsx --test tests/hosted-migration-replay.test.ts
        env:
          HOSTED_REPLAY_TEST_DATABASE_URL: postgresql://postgres:isolated-test-password@127.0.0.1:5432/victoriosa_hosted_replay_test

      - name: Create disposable consultation database
        run: createdb -h 127.0.0.1 -p 5432 -U postgres victoriosa_beauty_test
        env:
          PGPASSWORD: isolated-test-password

      - name: Consultation concurrency privacy and retention regression
        run: node --import tsx --test tests/consultation-postgres.test.ts
        env:
          BEAUTY_TEST_DATABASE_URL: postgresql://postgres:isolated-test-password@127.0.0.1:5432/victoriosa_beauty_test

      - name: Governance guardrails
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for obvious committed secrets..."
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9_-]{20,})' -- ':!.env.example' ':!package-lock.json' ':!bun.lock'; then
            echo "Potential hard-coded secret detected."
            exit 1
          fi
          echo "Guardrails passed."

