name: ECC Browser Smoke
on:
  pull_request:
    paths:
      - '.opencode/**'
      - 'scripts/run-opencode-safe.ps1'
      - 'scripts/e2e-public-smoke.mjs'
      - '.github/workflows/ecc-browser-smoke.yml'
      - 'src/**'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated Playwright browser runtime
        run: |
          mkdir -p /tmp/ecc-browser
          cd /tmp/ecc-browser
          npm install playwright@1.56.1 --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run preview and browser assertions
        run: |
          npm run preview -- --host 127.0.0.1 --port 4178 --strictPort > /tmp/ecc-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_PLAYWRIGHT_PATH=/tmp/ecc-browser/node_modules/playwright E2E_BASE_URL=http://127.0.0.1:4178/ node scripts/e2e-public-smoke.mjs
