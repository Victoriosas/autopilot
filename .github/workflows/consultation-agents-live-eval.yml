name: Consultation agents manual synthetic evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consultation-paid-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tests without credentials
        run: node --import tsx --test src/storefront/consultationAgentEval.test.ts src/storefront/consultationModelGateway.test.ts
      - name: Validate frozen cases without spending
        run: npm run eval:consultation-agents -- --dry-run --split all --confirm-final --max-usd 3
      - name: Evaluate synthetic cases once, at most USD 3
        run: npm run eval:consultation-agents -- --split all --confirm-final --max-usd 3 --out output/consultation-agents-eval/manual.json
        env:
          CAMELAI_API_KEY: ${{ secrets.CAMELAI_API_KEY }}
      - name: Preserve sanitized evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consultation-synthetic-evaluation
          path: output/consultation-agents-eval/manual.json
          retention-days: 7
          if-no-files-found: ignore
