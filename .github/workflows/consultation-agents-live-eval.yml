name: Consultation agents manual synthetic evaluation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke primero; full solo tras aprobar desarrollo'
        type: choice
        default: smoke
        required: true
        options: [smoke, development, full]
permissions:
  contents: read
concurrency:
  group: consultation-paid-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tests without credentials
        run: node --import tsx --test src/storefront/consultationAgentEval.test.ts src/storefront/consultationModelGateway.test.ts
      - name: Validate frozen cases without spending
        run: npm run eval:consultation-agents -- --dry-run --split all --confirm-final --max-usd 3
      - name: Evaluate authorized synthetic selection once
        env:
          EVALUATION_MODE: ${{ inputs.mode }}
          CAMELAI_API_KEY: ${{ secrets.CAMELAI_API_KEY }}
        run: |
          case "$EVALUATION_MODE" in
            smoke) selection=(--split desarrollo --limit 3 --max-usd 0.30) ;;
            development) selection=(--split desarrollo --max-usd 2.04) ;;
            full) selection=(--split all --confirm-final --max-usd 2.52) ;;
            *) echo 'Invalid evaluation mode'; exit 2 ;;
          esac
          npm run eval:consultation-agents -- "${selection[@]}" --out output/consultation-agents-eval/manual.json
      - name: Preserve sanitized evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consultation-synthetic-evaluation
          path: output/consultation-agents-eval/manual.json
          retention-days: 7
          if-no-files-found: ignore
