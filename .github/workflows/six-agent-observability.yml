name: Victoriosas six-agent observability
on:
  schedule:
    # 22:00 UTC = 19:00 Uruguay; GitHub cron is best-effort.
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: victoriosas-six-agent-observability
  cancel-in-progress: false
jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://jfjzpwlrhzqbcrvqxhzf.supabase.co
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify report invariants
        run: node --test scripts/agent-daily-report.test.mjs
      - name: Generate private GitHub Step Summary
        run: node scripts/agent-daily-report.mjs
