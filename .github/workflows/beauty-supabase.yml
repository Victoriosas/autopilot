name: Isolated Beauty Supabase
on:
  push:
    branches: [main, 'codex/**', 'chatgpt/beauty-contact-form-20261023']
    paths: ['src/storefront/beauty*', 'src/storefront/consultation*', 'src/components/admin/Consultation*', 'src/components/public/ConsultationForm.tsx', 'scripts/test-consultation-*-browser.ts', 'src/security/adminAuth.ts', 'tests/beauty*', 'tests/consultation*', 'supabase/migrations/*.sql', 'supabase/legacy-migrations/*beauty*.sql', 'supabase/legacy-migrations/*consultation*.sql', 'docs/CONSULTATION_FORM_104_QA.md', '.github/workflows/beauty-supabase.yml']
permissions:
  contents: read
concurrency:
  group: beauty-supabase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beauty-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Prepare only disposable Beauty stack
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/victoriosa-beauty-ci"
          mkdir -p "$fixture"
          supabase init --workdir "$fixture"
          mkdir -p "$fixture/supabase/migrations"
          cp supabase/migration.sql "$fixture/supabase/migrations/20260901000000_legacy_base.sql"
          cp supabase/migration-sourcing.sql "$fixture/supabase/migrations/20260901000001_legacy_sourcing.sql"
          cp tests/supabase-managed-rls-prerequisite.sql "$fixture/supabase/migrations/20260901000002_managed_rls.sql"
          cp supabase/migrations/*.sql "$fixture/supabase/migrations/"
          cp supabase/staged/consultation_material_requests_v1.sql "$fixture/supabase/migrations/20261111000000_material_requests_staged.sql"
          cp supabase/staged/consultation_material_admin_v1.sql "$fixture/supabase/migrations/20261112000000_material_admin_staged.sql"
      - name: Start real local Auth and PostgREST
        run: |
          if ! supabase start --workdir "$RUNNER_TEMP/victoriosa-beauty-ci" -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > "$RUNNER_TEMP/beauty-start.log" 2>&1; then
            node scripts/print-supabase-start-failure.mjs "$RUNNER_TEMP/beauty-start.log"
            exit 1
          fi
          supabase status --workdir "$RUNNER_TEMP/victoriosa-beauty-ci" -o json > "$RUNNER_TEMP/beauty-status.json"
      - name: Test actual Beauty integration
        run: |
          set -euo pipefail
          command -v psql > /dev/null
          node --import tsx --test tests/beauty-supabase.test.ts
          node --import tsx --test tests/beauty-management-supabase.test.ts
          node --import tsx --test tests/consultation-material-supabase.test.ts
          node --import tsx --experimental-test-coverage --test-coverage-include='**/consultationReading.ts' --test tests/consultation-supabase.test.ts
        env:
          BEAUTY_SYNTHETIC_SUPABASE: 'true'
          SUPABASE_LOCAL_STATUS_FILE: ${{ runner.temp }}/beauty-status.json
      - name: Install isolated browser runtime
        run: |
          mkdir -p "$RUNNER_TEMP/consultation-browser"
          cd "$RUNNER_TEMP/consultation-browser"
          npm install playwright@1.56.1 --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Synthetic form and laboratory browser journey
        run: |
          CONSULTATION_PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/consultation-browser/node_modules/playwright/index.mjs" node --import tsx scripts/test-consultation-form-browser.ts
          CONSULTATION_PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/consultation-browser/node_modules/playwright/index.mjs" node --import tsx scripts/test-consultation-lab-browser.ts
          CONSULTATION_PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/consultation-browser/node_modules/playwright/index.mjs" node --import tsx scripts/test-consultation-material-browser.ts
        env:
          BEAUTY_SYNTHETIC_SUPABASE: 'true'
          SUPABASE_LOCAL_STATUS_FILE: ${{ runner.temp }}/beauty-status.json
      - name: Retain synthetic screenshots
        uses: actions/upload-artifact@v7
        with:
          name: consultation-lab-synthetic
          path: output/consultation-lab/*.png
      - name: Stop only disposable stack
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/victoriosa-beauty-ci" --no-backup
