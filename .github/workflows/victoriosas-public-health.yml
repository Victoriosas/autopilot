name: Victoriosas Public Health
on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Public routes and closed commercial gates
        run: node scripts/public-health.mjs
