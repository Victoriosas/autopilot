name: Victoriosas Public Health
on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public routes respond without private content
        shell: bash
        run: |
          set -euo pipefail
          for path in / /servicios-sofia.html /api/health; do
            status=$(curl --silent --show-error --location --max-time 20 --output /tmp/victoriosas-response --write-out '%{http_code}' "https://victoriosas.online${path}")
            echo "${path}: HTTP ${status}"
            test "${status}" = 200
          done
      - name: Beauty commercial forms remain closed until authorized
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://victoriosas.online/api/beauty/config > /tmp/victoriosas-beauty-config.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/victoriosas-beauty-config.json','utf8')); if(typeof x.requestsEnabled!=='boolean') process.exit(1); console.log('Beauty request state returned explicitly:',x.requestsEnabled);"
