name: Consultation agents evaluator (safe check)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation mode"
        required: true
        type: choice
        options:
          - dry-run
  pull_request:
    paths:
      - 'scripts/eval-consultation-agents.ts'
      - 'src/storefront/consultationAgentEval*'
      - 'src/storefront/consultationAgentPrompts.ts'
      - 'docs/consultation-agents/**'
      - '.github/workflows/consultation-agents-eval.yml'
permissions:
  contents: read
concurrency:
  group: consultation-eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate synthetic evaluation suite without API calls
        run: npm run eval:consultation-agents -- --dry-run --split desarrollo
      - name: TypeScript
        run: npm run lint
# Paid evaluations deliberately disabled until a provable total spending cap,
# authorization policy and result redaction are reviewed. No API secret is
# injected into pull requests or this validation job.
