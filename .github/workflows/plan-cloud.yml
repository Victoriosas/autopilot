name: PLAN Cloud - auditoria segura
on:
  workflow_run:
    workflows: ['Autopilot Core v4']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "inventario (sin IA) o codex (requiere secreto de API)"
        type: choice
        required: true
        default: inventory
        options: [inventory, codex, hosted-status, hosted-resume]
      mission_id:
        description: 'ID synthetic previamente admitida; solo modos hosted'
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/plan-cloud.yml'
      - '.agents/skills/plan/**'
      - 'scripts/plan_cloud_inventory.py'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: plan-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  continuation:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout or artifact download from the triggering branch: workflow_run is privileged.
      - name: Record durable handoff and fail closed
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          successful = os.environ['SOURCE_RESULT'] == 'success'
          evidence = {
            'schema_version': 1,
            'source_sha': os.environ['SOURCE_SHA'],
            'source_run': os.environ['SOURCE_RUN'],
            'state': 'blocked',
            'reason': 'cloud_ledger_adapter_not_configured' if successful else 'source_ci_not_successful',
            'executed': False,
            'scheduler_created': False,
          }
          Path('continuation.json').write_text(json.dumps(evidence, indent=2))
          print(evidence['reason'])
          raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-${{ github.event.workflow_run.id }}
          path: continuation.json
          retention-days: 14
  inventory:
    if: ${{ github.event_name != 'workflow_run' && inputs.mode != 'hosted-status' && inputs.mode != 'hosted-resume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only P0 inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/plan_cloud_inventory.py
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-cloud-inventory-${{ github.run_id }}
          path: plan-cloud-output/
          if-no-files-found: warn
          retention-days: 14
  codex:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'codex' }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check API configuration
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_API_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY in GitHub Actions secrets before running Codex."
            exit 1
          fi
      - name: Execute plan in read-only sandbox
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: read-only
          sandbox: read-only
          output-file: plan-cloud-analysis.md
          prompt: |
            Use the local .agents/skills/plan/SKILL.md as your planning instructions.
            Read AGENTS.md and relevant direction and checkpoint docs.
            Inspect only the checked out repository and plan-cloud-output/inventory.json.
            Create a concise factual P0 report in Spanish, using your final response.
            State gaps explicitly: this runner cannot inspect remote Windows writers or live systems.
            Do not change files, execute mutating commands, send messages, make deployments,
            create PRs, or treat planning as authorization.
      - name: Publish Codex report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-cloud-codex-${{ github.run_id }}
          path: plan-cloud-analysis.md
          if-no-files-found: warn
          retention-days: 14
  hosted-ledger:
    # No PR/workflow_run credentials. Exact reviewed commit AND protected environment required.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.mode == 'hosted-status' || inputs.mode == 'hosted-resume') && vars.P0C_HOSTED_REVIEWED_SHA == github.sha }}
    environment: p0c-hosted-ledger
    concurrency:
      group: p0c-hosted-ledger
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated synthetic ledger operation
        env:
          P0C_RUNNER_PASSWORD: ${{ secrets.P0C_LEDGER_RUNNER_PASSWORD }}
          P0C_CA_CERT: ${{ secrets.P0C_LEDGER_CA_CERT }}
          P0C_REVIEWED_SHA: ${{ vars.P0C_HOSTED_REVIEWED_SHA }}
          P0C_MISSION_ID: ${{ inputs.mission_id }}
          P0C_ACTION: ${{ inputs.mode == 'hosted-status' && 'status' || 'resume' }}
        run: node --import tsx scripts/hosted-ledger-runner.mjs
