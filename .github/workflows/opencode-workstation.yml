name: OpenCode workstation
on:
  pull_request:
    paths:
      - 'tools/opencode-workstation/**'
      - 'opencode.json'
      - '.github/workflows/opencode-workstation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/opencode-workstation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/opencode-workstation/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify generated profiles are current
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- profiles
      - name: Validate project config JSON
        run: node -e "JSON.parse(require('fs').readFileSync('../../opencode.json', 'utf8'))"
