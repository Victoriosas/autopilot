name: Edge function static security invariants
on:
  pull_request:
    paths:
      - 'supabase/functions/six-agent-report-metrics/**'
      - '.github/workflows/six-agent-report-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check OIDC authorization invariants
        run: node --test scripts/six-agent-edge-security.test.mjs
